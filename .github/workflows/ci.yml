name: EduTrack CI

on:
  push:
    branches: [Duy, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel obsolete runs of the same event/ref; keep PR checks separate from pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: Capstone2/frontend
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: Capstone2/frontend/.nvmrc
          cache: npm
          cache-dependency-path: Capstone2/frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      # Only offline unit/contract tests; excludes *.browser.mjs and *.integration.mjs.
      - name: Run unit tests
        run: npm test

      - name: Build production frontend
        run: npm run build

  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'
    defaults:
      run:
        shell: bash
        working-directory: Capstone2
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up .NET SDK 8
        id: dotnet
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 8.0.x

      # Hosted runners can have newer SDKs installed. Pin selection for this checkout
      # without changing the SDK requirement of developers' local workspaces.
      - name: Select the installed .NET 8 SDK
        env:
          DOTNET_SDK_VERSION: ${{ steps.dotnet.outputs.dotnet-version }}
        run: |
          dotnet new globaljson --sdk-version "$DOTNET_SDK_VERSION" --roll-forward latestPatch
          dotnet --info

      # Use explicit projects: the existing .slnx requires a newer SDK than .NET 8.
      - name: Restore API dependencies
        run: dotnet restore backend/EduTrack.API.csproj

      - name: Restore policy checks
        run: dotnet restore backend.Tests/TuitionPolicy.Tests.csproj

      - name: Restore student enrollment checks
        run: dotnet restore backend.Tests/StudentEnrollment/StudentEnrollment.Tests.csproj

      - name: Build API (Release)
        run: dotnet build backend/EduTrack.API.csproj --configuration Release --no-restore

      - name: Build policy checks (Release)
        run: dotnet build backend.Tests/TuitionPolicy.Tests.csproj --configuration Release --no-restore

      # This executable links only TuitionPolicy.cs; it does not start the API,
      # create a DbContext, read a connection string or run EF migrations.
      # There is currently no Microsoft.NET.Test.Sdk / xUnit / NUnit / MSTest project.
      - name: Run Tuition Policy checks (console harness)
        run: dotnet run --project backend.Tests/TuitionPolicy.Tests.csproj --configuration Release --no-build --no-restore

      - name: Build student enrollment checks (Release)
        run: dotnet build backend.Tests/StudentEnrollment/StudentEnrollment.Tests.csproj --configuration Release --no-restore

      # No --mysql: policy assertions only, no API host, configuration or database access.
      - name: Run Student Enrollment policy checks (console harness)
        run: dotnet run --project backend.Tests/StudentEnrollment/StudentEnrollment.Tests.csproj --configuration Release --no-build --no-restore

      - name: Restore Tuition generation checks
        run: dotnet restore backend.Tests/TuitionIntegration/TuitionIntegration.Tests.csproj

      - name: Build Tuition generation checks
        run: dotnet build backend.Tests/TuitionIntegration/TuitionIntegration.Tests.csproj --configuration Release --no-restore

      # Default mode is offline policy only. Never initializes a database in CI.
      - name: Run Tuition generation policy checks
        run: dotnet run --project backend.Tests/TuitionIntegration/TuitionIntegration.Tests.csproj --configuration Release --no-build --no-restore

      - name: Restore Schedule read checks
        run: dotnet restore backend.Tests/ScheduleRead/ScheduleRead.Tests.csproj

      - name: Build Schedule read checks
        run: dotnet build backend.Tests/ScheduleRead/ScheduleRead.Tests.csproj --configuration Release --no-restore

      # No database, test principal host, seeder or migrations in default mode.
      - name: Run Schedule identity and range checks
        run: dotnet run --project backend.Tests/ScheduleRead/ScheduleRead.Tests.csproj --configuration Release --no-build --no-restore

      - name: Restore Schedule management policy checks
        run: dotnet restore backend.Tests/ScheduleManagement/ScheduleManagement.Tests.csproj

      - name: Build Schedule management policy checks
        run: dotnet build backend.Tests/ScheduleManagement/ScheduleManagement.Tests.csproj --configuration Release --no-restore

      # Default mode validates policy only. No production host or database access.
      - name: Run Schedule management policy checks
        run: dotnet run --project backend.Tests/ScheduleManagement/ScheduleManagement.Tests.csproj --configuration Release --no-build --no-restore
