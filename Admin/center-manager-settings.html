<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EduTrack - Settings</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- EduTrack Layout CSS -->
    <link rel="stylesheet" href="assets/css/center-manager-layout.css" />
  </head>
  <body>
    <div class="app-shell">
      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <a class="brand" href="#">
            <span class="brand-mark">
              <i class="bi bi-mortarboard-fill"></i>
            </span>
            <span class="brand-text">EduTrack</span>
          </a>

          <button
            class="sidebar-collapse-btn"
            id="sidebarCollapseBtn"
            type="button"
            aria-label="Toggle sidebar"
          >
            <i class="bi bi-list"></i>
          </button>
        </div>

        <div class="center-box">
          <span class="center-avatar">
            <i class="bi bi-buildings-fill"></i>
          </span>
          <div class="center-info">
            <span class="center-name">EduTrack Center</span>
            <small>Learning Center</small>
          </div>
        </div>

        <nav class="sidebar-nav">
          <div class="nav-section">
            <div class="nav-heading">MAIN</div>
            <a class="nav-link" href="./center-manager-dashboard.html">
              <i class="bi bi-grid-1x2-fill"></i>
              <span>Dashboard</span>
            </a>
          </div>

          <div class="nav-section">
            <div class="nav-heading">MANAGEMENT</div>
            <a class="nav-link" href="./center-manager-userAccount.html">
              <i class="bi bi-person-gear"></i>
              <span>User Accounts</span>
            </a>
            <a class="nav-link" href="./center-manager-students.html">
              <i class="bi bi-mortarboard"></i>
              <span>Students</span>
            </a>
            <a class="nav-link" href="./center-manager-subjects.html">
              <i class="bi bi-journal-bookmark-fill"></i>
              <span>Subjects</span>
            </a>
            <a class="nav-link" href="./center-manager-classes.html">
              <i class="bi bi-collection-fill"></i>
              <span>Classes</span>
            </a>
          </div>

          <div class="nav-section">
            <div class="nav-heading">FINANCE</div>
            <a class="nav-link" href="./center-manager-tuition.html">
              <i class="bi bi-cash-stack"></i>
              <span>Tuition</span>
            </a>
            <a class="nav-link" href="./center-manager-approvalRequests.html">
              <i class="bi bi-check2-square"></i>
              <span>Approval Requests</span>
            </a>
          </div>

          <div class="nav-section">
            <div class="nav-heading">COMMUNICATION</div>
            <a class="nav-link" href="./center-manager-notifications.html">
              <i class="bi bi-megaphone-fill"></i>
              <span>Notifications</span>
            </a>
          </div>

          <div class="nav-section">
            <div class="nav-heading">REPORTING</div>
            <a class="nav-link" href="./center-manager-reports.html">
              <i class="bi bi-bar-chart-fill"></i>
              <span>Reports</span>
            </a>
          </div>

          <div class="nav-section pb-4">
            <div class="nav-heading">SYSTEM</div>
            <a class="nav-link active" href="./center-manager-settings.html">
              <i class="bi bi-gear-fill"></i>
              <span>Settings</span>
            </a>
          </div>
        </nav>
      </aside>

      <!-- Main area -->
      <div class="main-area">
        <!-- Header -->
        <header class="topbar">
          <div class="topbar-left">
            <button
              class="mobile-menu-btn"
              id="mobileMenuBtn"
              type="button"
              aria-label="Open menu"
            >
              <i class="bi bi-list"></i>
            </button>

            <div class="search-box">
              <i class="bi bi-search"></i>
              <input type="text" placeholder="Search" />
            </div>
          </div>

          <div class="topbar-actions">
            <button class="academic-year-btn" type="button">
              <i class="bi bi-calendar3"></i>
              <span>Academic Year : 2026 / 2027</span>
            </button>

            <button class="icon-btn" type="button" title="Language">
              <i class="bi bi-globe2"></i>
            </button>
            <button class="icon-btn" type="button" title="Theme">
              <i class="bi bi-moon-stars"></i>
            </button>
            <button
              class="icon-btn notification-btn"
              type="button"
              title="Notifications"
            >
              <i class="bi bi-bell"></i>
              <span class="status-dot"></span>
            </button>
            <button class="icon-btn" type="button" title="Fullscreen">
              <i class="bi bi-arrows-fullscreen"></i>
            </button>

            <button class="profile-btn" type="button">
              <span class="profile-avatar">CM</span>
            </button>
          </div>
        </header>

        <!-- Intentionally blank content area -->
        <main class="page-wrapper">
          <div class="page-content">
            <!-- Content grab here -->
          </div>
        </main>
      </div>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>
  </body>
</html>
