<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EduTrack - Teacher Layout</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <!-- EduTrack Layout CSS -->
    <link rel="stylesheet" href="assets/css/teacher-layout.css" />
</head>

<body>
    <div class="app-shell">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a class="brand" href="teacher-dashboard.html">
                    <span class="brand-mark">
                        <i class="bi bi-mortarboard-fill"></i>
                    </span>
                    <span class="brand-text">EduTrack</span>
                </a>

                <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" type="button" aria-label="Toggle sidebar">
                    <i class="bi bi-list"></i>
                </button>
            </div>

            <div class="center-box">
                <span class="center-avatar">
                    <i class="bi bi-buildings-fill"></i>
                </span>
                <div class="center-info">
                    <span class="center-name">EduTrack Center</span>
                    <small>Learning Center</small>
                </div>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-heading">MAIN</div>
                    <a class="nav-link" href="teacher-dashboard.html">
                        <i class="bi bi-grid-1x2-fill"></i>
                        <span>Dashboard</span>
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-heading">ACADEMIC</div>
                    <a class="nav-link" href="teacher-schedule.html">
                        <i class="bi bi-person-gear"></i>
                        <span>Schedule</span>
                    </a>
                    <a class="nav-link" href="teacher-classes.html">
                        <i class="bi bi-mortarboard"></i>
                        <span>My Classes</span>
                    </a>
                    <a class="nav-link" href="teacher-learning-progress.html">
                        <i class="bi bi-journal-bookmark-fill"></i>
                        <span>Learning Progress</span>
                    </a>

                </div>

                <div class="nav-section">
                    <div class="nav-heading">COMMUNICATION</div>
                    <a class="nav-link" href="teacher-notifications.html">
                        <i class="bi bi-megaphone-fill"></i>
                        <span>Notifications</span>
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-heading">REQUESTS</div>
                    <a class="nav-link" href="teacher-request.html">
                        <i class="bi bi-bar-chart-fill"></i>
                        <span>Request</span>
                    </a>
                </div>

            </nav>
        </aside>

        <!-- Main area -->
        <div class="main-area">
            <!-- Header -->
            <header class="topbar">
                <div class="topbar-left">
                    <button class="mobile-menu-btn" id="mobileMenuBtn" type="button" aria-label="Open menu">
                        <i class="bi bi-list"></i>
                    </button>

                    <div class="search-box">
                        <i class="bi bi-search"></i>
                        <input type="text" placeholder="Search" />
                    </div>
                </div>

                <div class="topbar-actions">
                    <button class="academic-year-btn" type="button">
                        <i class="bi bi-calendar3"></i>
                        <span>Academic Year : 2026 / 2027</span>
                    </button>

                    <button class="icon-btn" type="button" title="Language">
                        <i class="bi bi-globe2"></i>
                    </button>
                    <button class="icon-btn" type="button" title="Theme">
                        <i class="bi bi-moon-stars"></i>
                    </button>
                    <button class="icon-btn notification-btn" type="button" title="Notifications">
                        <i class="bi bi-bell"></i>
                        <span class="status-dot"></span>
                    </button>
                    <button class="icon-btn" type="button" title="Fullscreen">
                        <i class="bi bi-arrows-fullscreen"></i>
                    </button>

                    <a class="profile-btn" href="teacher-profile.html" title="Profile">
                        <span class="profile-avatar">TC</span>
                    </a>
                </div>
            </header>

            <!-- Intentionally blank content area -->
            <main class="page-wrapper">
                <div class="page-content">
                    <!-- Breadcrumb & Page Title -->
                    <div class="d-md-flex d-block align-items-center justify-content-between mb-3">
                        <div class="my-auto mb-2">
                            <h3 class="page-title mb-1">New Assignment</h3>
                            <nav>
                                <ol class="breadcrumb mb-0">
                                    <li class="breadcrumb-item">
                                        <a href="teacher-dashboard.html">Dashboard</a>
                                    </li>
                                    <li class="breadcrumb-item">
                                        <a href="teacher-classes.html">My Classes</a>
                                    </li>
                                    <li class="breadcrumb-item">
                                        <a href="teacher-class-details.html">Class I-A</a>
                                    </li>
                                    <li class="breadcrumb-item active" aria-current="page">
                                        New Assignment
                                    </li>
                                </ol>
                            </nav>
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <a href="teacher-class-details.html"
                                class="btn btn-outline-secondary btn-sm d-inline-flex align-items-center gap-1">
                                <i class="bi bi-arrow-left"></i> Back to Class Details
                            </a>
                        </div>
                    </div>

                    <!-- New Assignment Form Card -->
                    <div class="card class-list-card border-0 mb-4">
                        <div class="class-list-header py-3 px-4 border-bottom">
                            <h4 class="class-list-title mb-0">Create Assignment</h4>
                        </div>
                        <div class="card-body p-4">
                            <form>
                                <div class="row g-3">
                                    <!-- Assignment Title -->
                                    <div class="col-md-8">
                                        <label for="assignmentTitle" class="form-label fw-semibold text-dark">Assignment
                                            Title <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="assignmentTitle"
                                            placeholder="e.g. Assignment 4: Momentum &amp; Impulse">
                                    </div>

                                    <!-- Deadline -->
                                    <div class="col-md-4">
                                        <label for="assignmentDeadline"
                                            class="form-label fw-semibold text-dark">Deadline <span
                                                class="text-danger">*</span></label>
                                        <input type="datetime-local" class="form-control" id="assignmentDeadline">
                                    </div>

                                    <!-- Assignment Type Radio Buttons -->
                                    <div class="col-12 mt-3">
                                        <label class="form-label fw-semibold text-dark d-block">Assignment Type <span
                                                class="text-danger">*</span></label>
                                        <div class="d-flex align-items-center gap-4 flex-wrap">
                                            <div class="form-check">
                                                <input class="form-check-input" type="radio" name="assignmentType"
                                                    id="typeMultipleChoice" checked>
                                                <label class="form-check-label text-dark cursor-pointer fw-medium"
                                                    for="typeMultipleChoice">
                                                    Multiple Choice Questions
                                                </label>
                                            </div>
                                            <div class="form-check">
                                                <input class="form-check-input" type="radio" name="assignmentType"
                                                    id="typeWritten">
                                                <label class="form-check-label text-dark cursor-pointer fw-medium"
                                                    for="typeWritten">
                                                    Written Assignment
                                                </label>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Description -->
                                    <div class="col-12 mt-3">
                                        <label for="assignmentDescription"
                                            class="form-label fw-semibold text-dark">Description</label>
                                        <textarea class="form-control" id="assignmentDescription" rows="4"
                                            placeholder="Provide instructions or details for this assignment..."></textarea>
                                    </div>

                                    <!-- Attachment -->
                                    <div class="col-12 mt-3">
                                        <label for="assignmentAttachment"
                                            class="form-label fw-semibold text-dark">Attachment</label>
                                        <textarea class="form-control" id="assignmentAttachment" rows="3"></textarea>
                                    </div>
                                </div>

                                <!-- Form Actions (Cancel & Save) -->
                                <div class="d-flex align-items-center justify-content-end gap-2 mt-4 pt-3 border-top">
                                    <a href="teacher-class-details.html"
                                        class="btn btn-outline-secondary btn-sm">Cancel</a>
                                    <button type="button"
                                        class="btn btn-primary btn-sm d-inline-flex align-items-center gap-1">
                                        <i class="bi bi-check-lg"></i> Save Assignment
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
